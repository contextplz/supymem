# Deterministic vocabularies for the Idea Lab filters (37 §5).
# Every list here is read by app/idealab/filters.py. Nothing in this file is
# founder-facing copy; it is match data only.

# Filter 4 — phrasing that makes an idea sound confident and say nothing.
banned_phrases:
  - "AI-powered platform"
  - "revolutionize"
  - "revolutionise"
  - "one-stop shop"
  - "Uber for"
  - "disrupt"
  - "seamless"

# Filter 5 — a first customer must be a describable group. At least one
# qualifier from any category below must be present, and a bare category name
# never counts as one.
customer_qualifiers:
  geography:
    - " in "
    - " near "
    - " across "
    - " around "
    - "local"
    - "regional"
    - "rural"
    - "urban"
  size:
    - "small"
    - "solo"
    - "single"
    - "independent"
    - "boutique"
    - "family-run"
    - "family run"
    - "two-person"
    - "mid-sized"
    - "midsize"
    - "under "
    - "fewer than"
    - "person "
    - "seat "
  role:
    - "owner"
    - "manager"
    - "founder"
    - "director"
    - "operator"
    - "practitioner"
    - "practice"
    - "teacher"
    - "nurse"
    - "coach"
    - "accountant"
    - "recruiter"
    - "bookkeeper"
    - "landlord"
    - "supervisor"
    - "coordinator"
    - "technician"
    - "installer"
    - "dispatcher"
  behaviour:
    - " who "
    - " that "
    - " still "
    - " using "
    - " with "
    - " without "
    - " after "
    - " before "
    - " when "
    - " because "

# Filter 5 — market categories masquerading as customers.
category_only:
  - "healthtech"
  - "fintech"
  - "edtech"
  - "proptech"
  - "insurtech"
  - "martech"
  - "legaltech"
  - "consumers"
  - "businesses"
  - "enterprises"
  - "startups"
  - "developers"
  - "smbs"
  - "smes"
  - "professionals"
  - "millennials"
  - "gen z"
  - "the market"
  - "everyone"
  - "users"

# Filter 6 — work nobody can start without a licence or certification.
licence_markers:
  - "licensed"
  - "licence required"
  - "license required"
  - "board-certified"
  - "board certified"
  - "medical device"
  - "clinical trial"
  - "prescription"
  - "diagnose"
  - "diagnosis"
  - "practise medicine"
  - "practice medicine"
  - "legal advice"
  - "attorney of record"
  - "notary"
  - "broker-dealer"
  - "broker dealer"
  - "insurance carrier"
  - "money transmitter"
  - "custody of funds"
  - "pharmacy"
  - "fda approval"
  - "hipaa-certified"

# Filter 6 — capital a nights-and-weekends founder does not have.
capital_markers:
  - "warehouse"
  - "factory"
  - "manufacturing line"
  - "fleet of"
  - "buy inventory"
  - "hold inventory"
  - "physical storefront"
  - "retail location"
  - "hardware production"
  - "cold chain"
  - "delivery drivers"
  - "clinic"
  - "upfront capital"
  - "raise a seed round"

# §6 anti-goals — market sizes, invented user counts and borrowed credibility.
fabrication_patterns:
  - "\\$\\s?\\d"
  - "\\b\\d+(?:\\.\\d+)?\\s?(?:m|bn|k|million|billion|trillion)\\b\\s*(?:\\+)?\\s*(?:market|opportunity|industry|spend)"
  - "\\btotal addressable market\\b"
  - "\\btam\\b"
  - "\\b\\d+(?:,\\d{3})+\\s+(?:users|customers|teams|companies)\\b"
  - "\\btrusted by\\b"
  - "\\bwinner of\\b"
