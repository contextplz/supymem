# Fixed catalog of founder secrets. AI may request a slot. It never receives a value.
# UI renders one password field per env_key. Saved values go to .env + the vault.

slots:
  - id: openai.api_key
    group: llm
    provider: openai
    label: OpenAI API key
    env_keys: [OPENAI_API_KEY]
    why: Call OpenAI models with your own key.
    help_url: https://platform.openai.com/api-keys
    prefix: ["sk-"]

  - id: anthropic.api_key
    group: llm
    provider: anthropic
    label: Anthropic API key
    env_keys: [ANTHROPIC_API_KEY]
    why: Call Claude with your own key.
    help_url: https://console.anthropic.com/settings/keys
    prefix: ["sk-ant-"]

  - id: google.api_key
    group: llm
    provider: google
    label: Google AI API key
    env_keys: [GOOGLE_API_KEY]
    why: Call Gemini with your own key.
    help_url: https://aistudio.google.com/apikey
    prefix: ["AIza"]

  - id: deepseek.api_key
    group: llm
    provider: deepseek_direct
    label: DeepSeek API key
    env_keys: [DEEPSEEK_API_KEY]
    why: Call DeepSeek with your own key.
    help_url: https://platform.deepseek.com/api_keys

  - id: xai.api_key
    group: llm
    provider: xai
    label: xAI API key
    env_keys: [XAI_API_KEY]
    why: Call Grok with your own key.

  - id: openrouter.api_key
    group: llm
    provider: openrouter
    label: OpenRouter API key
    env_keys: [OPENROUTER_API_KEY]
    why: Route models through OpenRouter.

  - id: azure.api_key
    group: llm
    provider: azure_foundry
    label: Azure AI Foundry key
    env_keys: [AZURE_API_KEY]
    why: Call models hosted on Azure AI Foundry.

  - id: aws.credentials
    group: cloud
    provider: aws
    label: AWS credentials
    env_keys: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
    why: Create or manage AWS resources for this company.
    help_url: https://console.aws.amazon.com/iam/
    prefix: ["AKIA"]

  - id: github.pat
    group: connectors
    provider: github
    label: GitHub personal access token
    env_keys: [GITHUB_TOKEN]
    why: Open a real repository and pull requests.
    help_url: https://github.com/settings/tokens
    prefix: ["ghp_", "github_pat_"]

  - id: linear.api_key
    group: connectors
    provider: linear
    label: Linear API key
    env_keys: [LINEAR_API_KEY]
    why: Read and file Linear issues.
    help_url: https://linear.app/settings/api
    prefix: ["lin_api_"]

  - id: zernio.api_key
    group: social
    provider: social
    label: Zernio API key
    env_keys: [ZERNIO_API_KEY]
    why: Publish social posts through your connected accounts.
    help_url: https://zernio.com/dashboard/api-keys
    prefix: ["sk_", "zn_"]

  - id: stripe.secret_key
    group: payments
    provider: stripe
    label: Stripe secret key
    env_keys: [STRIPE_SECRET_KEY]
    why: Optional BYO key if you already have Stripe. Preferred path is Complete Stripe on Supymem (Connect Express).
    help_url: https://dashboard.stripe.com/apikeys
    prefix: ["sk_test_", "sk_live_"]

  - id: razorpay.key_secret
    group: payments
    provider: razorpay
    label: Razorpay keys
    env_keys: [RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET]
    why: Take payments in India through Razorpay.
    help_url: https://dashboard.razorpay.com/app/website-app-settings/api-keys
    prefix: ["rzp_"]

  - id: firecrawl.api_key
    group: research
    provider: firecrawl
    label: Firecrawl API key
    env_keys: [FIRECRAWL_API_KEY]
    why: Fetch live pages for research.

  - id: cursor.api_key
    group: coding
    provider: cursor
    label: Cursor API key
    env_keys: [CURSOR_API_KEY]
    why: Dispatch coding work to Cursor on this machine.

  - id: supabase.project
    group: backend
    provider: supabase
    label: Supabase project keys
    env_keys: [NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY]
    why: Connect your Supabase project (Project URL and anon/publishable key) to your hosted product.
    help_url: https://supabase.com/dashboard

  - id: generic.credential
    group: other
    provider: other
    label: Credential
    env_keys: [FOUNDER_CREDENTIAL]
    why: A secret this company needs that is not in the named catalog.
