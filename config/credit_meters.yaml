  # Character rows are estimates only. Mini TTS settles its SSE token receipt.
  tts_character: {unit: character, micro: 15, basis: "tts-1 only; not mini TTS settlement", source: "https://developers.openai.com/api/docs/models/tts-1", verified_on: "2026-10-08"}
  email_send: {unit: recipient, micro: 900, basis: "Resend paid-plan marginal overage", source: "https://resend.com/pricing", verified_on: "2026-10-08"}
  sms_send: {unit: sms, micro: 8000}
minimum_reservation_micro: 100
