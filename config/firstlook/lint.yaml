# Content-linter vocabulary (45 §6, LD-60).
#
# The linter is deterministic and refuses copy rather than trusting a prompt
# instruction: models produce fake testimonials and invented market sizes by
# default, and a founder who has to tell a friend the testimonials are fake has
# been actively harmed by us. Phrases are matched case-insensitively on word
# boundaries. `app/firstlook/lint.py` merges `config/idealab_banned.yaml` on top
# of `banned_vocabulary` when that file exists (shared list, 37 §5.4).
version: 1

social_proof:
  - trusted by
  - as seen in
  - as featured in
  - backed by
  - award-winning
  - award winning
  - loved by
  - join thousands
  - used by teams at
  - customers include
  - our customers say
  - testimonials
  - "#1"
  - number one
  - top rated
  - top-rated
  - highest rated

superlatives:
  - best
  - best-in-class
  - leading
  - market-leading
  - revolutionary
  - world-class
  - world class
  - cutting-edge
  - cutting edge
  - unmatched
  - unrivalled
  - unrivaled
  - state-of-the-art
  - industry-standard
  - the ultimate

banned_vocabulary:
  - ai-powered
  - ai powered
  - powered by ai
  - seamless
  - seamlessly
  - one-stop
  - one stop shop
  - disrupt
  - disrupting
  - disruptive
  - game-changing
  - game changing
  - game changer
  - supercharge
  - supercharged
  - effortless
  - frictionless
  - next-generation
  - synergy
  - leverage
  - turnkey
  - "Built for"
  - "Designed for"
  - purple gradient
  - frictionless

commitments:
  - guaranteed
  - guarantee
  - money-back
  - money back
  - no risk
  - risk-free
  - we promise
  - promise you
  - free forever
  - lifetime access
  - cancel anytime
  - launching in
  - available from
  - ships in
  - coming in
  - starting at
  - as little as
  - /mo
  - /month

# Named third-party products. Flagged when they appear in generated copy but not
