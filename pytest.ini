[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath =
    .
    packages
    packages/harness
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: fast unit tests
    hosted: hosted service contract, deselected by the local/public unit command
    hosted_only: hosted service contract, skipped when SUPYMEM_MODE=local
    integration: integration tests
    acceptance: acceptance scenarios
    redteam: safety / red-team suite
