[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companyos-guardrails"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Deterministic + optional classifier guardrails for Supymem"
requires-python = ">=3.12"
dependencies = [
  "company-os-core",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
full = []
dev = ["pytest>=8.3.0"]

[tool.setuptools]
packages = ["guardrails"]

[tool.setuptools.package-dir]
"guardrails" = "."
