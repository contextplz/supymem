[project]
name = "desktop-runtime"
license = { text = "Apache-2.0" }
version = "1.0.0-rc.2"
requires-python = ">=3.11"
description = "Unified Company OS desktop sidecar (warden / core / gateway / bridge)"
dependencies = [
  "uvicorn[standard]>=0.27",
  "fastapi>=0.110",
  "httpx>=0.27",
  "playwright==1.61.0",
  "psutil==7.2.2",
  "Pillow>=10.4,<13",
  "mcp==1.29.0",
  "pyobjc-core==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
companyos-runtime = "desktop_runtime.__main__:main"

[project.optional-dependencies]
local-stack = ["keyring>=25,<26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["desktop_runtime", "desktop_runtime.cu_browser"]

[tool.setuptools.package-dir]
"desktop_runtime" = "."
"desktop_runtime.cu_browser" = "cu_browser"
