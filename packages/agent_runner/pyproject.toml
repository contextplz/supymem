[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runner"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Foundry-compatible Playwright evaluation runner for RL shopping"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "openai>=3.57.0",
  "playwright>=1.48.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "llm-gateway",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
rl-agent = "agent_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runner*"]
