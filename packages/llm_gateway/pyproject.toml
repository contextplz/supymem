[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Company OS LLM gateway — sole openai importer"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.54.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0",
  "jsonschema>=4.23.0",
  "httpx>=0.27.0",
  "cryptography>=43.0.0",
  "company-os-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools]
packages = ["llm_gateway"]

[tool.setuptools.package-dir]
"llm_gateway" = "."
