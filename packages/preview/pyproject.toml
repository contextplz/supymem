[project]
name = "company-os-preview"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["preview"]

[tool.setuptools.package-dir]
"preview" = "."
