[project]
name = "coding-agents"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coding_agents"]

[tool.setuptools.package-dir]
"coding_agents" = "."
