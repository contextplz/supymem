[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companyos-sdk"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Minimal Python SDK for Company OS"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools]
py-modules = ["companyos"]
