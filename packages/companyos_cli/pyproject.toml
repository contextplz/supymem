[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companyos-cli"
license = { text = "Apache-2.0" }
version = "0.1.0"
description = "Company OS CLI (cos) — thin HTTP client over company_os"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
cos = "cos:main"

[tool.setuptools]
py-modules = ["cos"]
