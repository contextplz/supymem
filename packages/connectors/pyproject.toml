[project]
name = "connectors"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["connectors", "connectors.channels", "connectors.hosting"]

[tool.setuptools.package-dir]
"connectors" = "."
"connectors.channels" = "channels"
"connectors.hosting" = "hosting"
