# Exact source checksum records qualified in ci-merge-queue-source-digest-findings.
# Retain every built-in rule. Only these exact JSON key/value lines at exact paths
# are nonsecret; a different value, key, path, or any other line remains scanned.
title = "Public release boundary and qualified synthetic fixtures"

[extend]
useDefault = true

