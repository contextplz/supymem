<g class="node c-purple" onclick="sendPrompt('Tell me more about define the question')"><rect x="40" y="40" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="58" text-anchor="middle" dominant-baseline="central">Define the question</text><text class="ts" x="170" y="78" text-anchor="middle" dominant-baseline="central">Bound the decision</text></g>
