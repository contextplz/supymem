<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src ipc: http://ipc.localhost">
<title>Supymem update</title>
<style>
:root{color-scheme:light;--bg:#f6f4f1;--surface:#fff;--surface-soft:#efece7;--line:rgba(32,24,18,.1);--line-soft:rgba(32,24,18,.06);--ink:#1c1917;--muted:#57534e;--quiet:#78716c;--accent:#7a3aad;--accent-hover:#8d4cc4;--accent-soft:rgba(122,58,173,.1);--danger:#c0392b;--danger-soft:rgba(192,57,43,.08);font:400 14px/1.55 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{padding:24px}.shell{max-width:560px;margin:0 auto}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:650}.mark{width:38px;height:38px;border-radius:11px;background:#fff;padding:4px;object-fit:contain;box-shadow:0 1px 3px rgba(28,25,23,.12)}.brand-copy{display:flex;flex-direction:column;line-height:1.25}.brand-copy strong{font-size:15px}.brand-copy span{color:var(--quiet);font-size:12px;font-weight:500}.card{margin-top:18px;padding:24px;border:1px solid var(--line-soft);border-radius:16px;background:var(--surface);box-shadow:0 1px 2px rgba(28,25,23,.06),0 12px 34px rgba(28,25,23,.05)}h1{font-size:24px;line-height:1.2;letter-spacing:-.025em;margin:0 0 10px}p{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.version{display:inline-flex;align-items:center;gap:7px;margin:16px 0 0;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.notes{margin-top:16px;padding:12px 13px;border-left:2px solid var(--accent);border-radius:0 10px 10px 0;background:var(--accent-soft);font-size:12.5px;color:var(--muted)}.error{margin-top:16px;padding:11px 13px;border:1px solid rgba(192,57,43,.16);border-radius:10px;background:var(--danger-soft);color:var(--danger)}.fine{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);color:var(--quiet);font-size:12px}footer{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}button{font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--line);border-radius:10px;padding:11px 15px;color:var(--ink);background:var(--surface);cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}button:hover:not(:disabled){background:var(--surface-soft);border-color:rgba(32,24,18,.15)}button:focus-visible{outline:3px solid rgba(122,58,173,.2);outline-offset:2px}button:disabled{opacity:.45;cursor:default}.primary{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(122,58,173,.22)}.primary:hover:not(:disabled){border-color:var(--accent-hover);background:var(--accent-hover)}progress{width:100%;height:6px;margin-top:18px;accent-color:var(--accent)}[hidden]{display:none!important}
</style></head><body><main class="shell"><div class="brand"><img class="mark" src="logo.png" alt="" width="38" height="38"><div class="brand-copy"><strong>Supymem</strong><span>Updates for Mac</span></div></div><section class="card"><h1 id="title">Checking for updates</h1><p id="status" role="status">Checking the secure release channel…</p><div id="version" class="version" hidden><span class="dot"></span><span id="version-text"></span></div><p id="notes" class="notes" hidden></p><progress id="progress" hidden></progress><p id="error" class="error" role="alert" hidden></p><p id="assurance" class="fine">Every update is signed and verified before installation.</p><p id="github-consent" hidden><label><input id="allow-github" type="checkbox"> Allow GitHub update checks</label></p><footer><button id="close">Later</button><button id="check" hidden>Check again</button><button id="install" class="primary" hidden>Install update</button></footer></section></main>
<p><a id="release" hidden>Open your release page</a></p>
<script>
'use strict';const $=id=>document.getElementById(id);const api=window.__TAURI__;const local=window.__SUPYMEM_LOCAL_UPDATES__===true;const consent=$("allow-github");let result=null,busy=false,unlisten;function errorMessage(e){return typeof e==='string'?e:e?.message||'The update operation could not finish.'}function setBusy(v){busy=v;$('check').disabled=v||local&&!consent.checked;consent.disabled=v;$('install').disabled=v;$('close').disabled=v}function showError(e){$('error').textContent=errorMessage(e);$('error').hidden=false}function setVersion(r){const visible=Boolean(r?.available&&r.version);$('version').hidden=!visible;$('version-text').textContent=visible?`Version ${r.version} is ready`:''}async function check(){if(busy||(local&&!consent.checked))return;setBusy(true);$('error').hidden=true;$('install').hidden=true;$('release').hidden=true;$('assurance').textContent='Every update is signed and verified before installation.';$('check').hidden=true;$('version').hidden=true;$('title').textContent='Checking for updates';$('status').textContent='Checking the secure release channel…';try{result=await api.core.invoke('check_for_update',{allowGithub:local&&consent.checked});const available=result.available,forced=result.force,verified=result.channel_verified;$('title').textContent=available?(forced?'Update required':'A better Supymem is ready'):(verified?'Supymem is up to date':'Update check unavailable');$('status').textContent=available?(forced?`Version ${result.version} is required to continue. Install it now to keep your workspace secure and current.`:`Version ${result.version} is ready. You can install now, or keep working and update later.`):(result.honesty||'Supymem could not verify the signed release channel. Nothing was installed.');setVersion(result);$('notes').textContent=result.notes||'';$('notes').hidden=!result.notes;$('install').hidden=!available||Boolean(result.release_url&&!result.check_id);$('release').hidden=!result.release_url;if(result.release_url){$('release').href=result.release_url;if(!result.check_id)$('assurance').textContent='Use the link to install this release yourself. Your app does not install it automatically.';$('title').textContent=available?'A new version is available':'Your releases';$('status').textContent=result.honesty||$('status').textContent;}$('install').textContent=forced?'Install required update':'Install update';$('close').textContent=forced?'':'Later';$('close').hidden=Boolean(forced);$('check').hidden=false}catch(e){$('title').textContent='Update check unavailable';$('status').textContent='Supymem kept running. No update was installed.';showError(e);$('check').hidden=false}finally{setBusy(false)}}$('check').onclick=check;$('close').onclick=async()=>{if(busy)return;try{await api.core.invoke('defer_update');await api.window.getCurrentWindow().close()}catch(e){showError(e)}};$('install').onclick=async()=>{if(busy||!result?.check_id)return;setBusy(true);$('error').hidden=true;try{await api.core.invoke('install_update',{checkId:result.check_id})}catch(e){showError(e);setBusy(false);$('progress').hidden=true;$('status').textContent='The update stopped. Supymem is still running safely; read the message above before trying again.'}};(async()=>{try{unlisten=await api.event.listen('supymem-update-progress',({payload})=>{$('progress').hidden=false;if(payload.total){$('progress').max=payload.total;$('progress').value=payload.downloaded}else{$('progress').removeAttribute('value')}$('status').textContent=payload.phase==='downloading'?`Downloading update… ${Math.round(payload.downloaded/1024/1024)} MB received.`:payload.phase==='installing'?'Signature verified. Installing update…':'Update installed. Restarting Supymem…'})}catch(e){showError(e)}if(local&&window.__SUPYMEM_UPDATE_REPO_CONFIGURED__===false){$('close').textContent='Close';$('title').textContent='Check for updates';$('assurance').hidden=true;try{const off=await api.core.invoke('check_for_update',{allowGithub:false});$('status').textContent=off.honesty}catch(e){$('status').textContent='Update checks are off for your build. Ask whoever supplied your installer for a newer one.';showError(e)}}else if(local){$('github-consent').hidden=false;consent.checked=false;consent.onchange=()=>setBusy(busy);$('check').hidden=false;$('check').textContent='Check now';$('close').textContent='Close';$('title').textContent='Check for updates';$('status').textContent='Update checks are off. To look for a new version, allow a request to GitHub and choose Check now.';$('assurance').textContent='Your app does not install updates automatically.';setBusy(false)}else{await check()}})();window.addEventListener('unload',()=>unlisten?.());
</script></body></html>
