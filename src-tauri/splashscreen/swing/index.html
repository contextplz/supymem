<!doctype html>
<html lang="en" class="fallback">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supymem</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      cursor: default; user-select: none; -webkit-user-select: none; }
    #stage { position: absolute; inset: 0; display: flex; justify-content: center; pointer-events: none; }
    #spin { position: relative; width: 48px; height: 62px; flex: 0 0 auto;
      transform-origin: 50% 6%; transition: transform 90ms ease-out; }
    #swing { position: absolute; inset: 0; display: block; width: 48px; height: 62px; }
    #poster { position: absolute; inset: 0; z-index: 1; display: block; width: 48px; height: 62px; }
    #poster span { position: absolute; inset: 0; margin: auto; width: 30px; height: 30px; display: grid;
      place-items: center; border-radius: 50%; background: #edf2f8; color: #162033; font: 600 16px system-ui, sans-serif; }
    #poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; visibility: hidden; }
    #poster.has-image img { visibility: visible; }
    #poster.has-image span { visibility: hidden; }
    html:not(.fallback) #poster { display: none; }
    html.fallback #swing { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      #spin { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage"><div id="spin">
    <canvas id="swing" width="96" height="124" aria-hidden="true"></canvas>
    <div id="poster" aria-hidden="true"><span>C</span><img src="./poster.png" alt="" /></div>
  </div></div>
  <script type="module">
    import { createMascotPlayer, setMascotState } from "./mascot-player.js";

    const spin = document.getElementById("spin");
    const poster = document.getElementById("poster");
    const preview = poster.querySelector("img");
    const showPreview = () => { if (preview.naturalWidth) poster.classList.add("has-image"); };
    preview.addEventListener("load", showPreview);
    showPreview();
    window.__mascotLean = (rad) => {
      const r = motion.matches ? 0 : Math.max(-0.28, Math.min(0.28, Number(rad) || 0));
      spin.style.transform = "rotate(" + r + "rad)";
    };
    window.__mascotHover = (on) => document.documentElement.classList.toggle("hover", on);
    const root = document.documentElement.classList;
    const canvas = document.getElementById("swing");
    const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let player;
    let failed = false;
    let state = "idle";
    let level = null;
    let visible = window.__mascotVisible;
    const updateVisibility = () => {
      const paused = failed || motion.matches || !(visible ?? !document.hidden);
      root.toggle("paused", paused);
      root.toggle("fallback", failed || motion.matches || !player);
      if (player) { if (paused) player.pause(); else player.play(); }
    };
    const applyState = () => {
      if (!player || failed || motion.matches) return;
      setMascotState(player, state, level);
      updateVisibility();
    };
    window.charlieMascot = {
      set(next, rms = null) {
        if (!["idle", "listening", "speaking"].includes(next)) return;
        state = next;
        level = Number.isFinite(rms) ? Math.max(0, Math.min(1, rms)) : null;
        applyState();
      },
    };
    Object.defineProperty(window, "__mascotVisible", {
      configurable: true,
      get: () => visible,
      set: (on) => { visible = on; updateVisibility(); },
    });
    document.addEventListener("visibilitychange", updateVisibility);
    motion.addEventListener("change", () => { window.__mascotLean(0); applyState(); updateVisibility(); });
    canvas.addEventListener("webglcontextlost", () => { failed = true; updateVisibility(); });
    window.addEventListener("pagehide", () => player?.dispose(), { once: true });
    updateVisibility();
    createMascotPlayer(canvas, { src: "./mascot_animations.glb", clip: "Swing_Joy", loop: true, autoplay: false, onClipEnd: applyState })
      .then(loaded => { player = loaded; applyState(); updateVisibility(); })
      .catch(() => { failed = true; updateVisibility(); });
  </script>
</body>
</html>
