<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting your app</title>
  <style>
    html, body { margin:0; height:100%; background:#f7f5ef; color:#23231f; font-family:system-ui,sans-serif; }
    main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; text-align:center; padding:24px; box-sizing:border-box; }
    .mascot { width:96px; height:96px; border-radius:20px; background:#1e3b54; animation:breathe 2s ease-in-out infinite; }
    h1 { font-size:1.5rem; margin:0; }
    p { max-width:30rem; margin:0; line-height:1.5; }
    @keyframes breathe { 50% { transform:translateY(-6px); } }
    @media (prefers-reduced-motion:reduce) { .mascot { animation:none; } }
  </style>
</head>
<body>
  <main>
    <div class="mascot" role="img" aria-label="Charlie"></div>
    <h1>Starting your app</h1>
    <p role="status">Your app is getting ready. You can set up your services as soon as it opens.</p>
    <p>If this screen does not change, quit and reopen your app to retry. Your saved work is retained.</p>
  </main>
</body>
</html>
