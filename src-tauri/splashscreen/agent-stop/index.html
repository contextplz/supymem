<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supymem stop</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      user-select: none; -webkit-user-select: none; cursor: default; }
    /* Visual only: the native shell detects the press. This page has no IPC. */
    #stop { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center;
      justify-content: center; gap: 6px; border-radius: 14px; background: #d92d20; color: #fff;
      font: 600 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      border: 1px solid rgba(255,255,255,.55); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    #stop:hover { background: #b42318; }
    #stop i { width: 9px; height: 9px; border-radius: 2px; background: #fff; }
  </style>
</head>
<body><div id="stop" role="button" aria-label="Stop computer use"><i></i>Stop</div></body>
</html>
