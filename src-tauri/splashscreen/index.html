<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Supymem</title>
  <style>
    :root { --bg:#0f1419; --fg:#f4efe6; --accent:#d4a373; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family: "Iowan Old Style", Georgia, serif; }
    main { height:100%; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:1rem; }
    .mark { width:88px; height:88px; object-fit:contain; border-radius:18px;
      background:#fff; padding:8px; box-sizing:border-box; }
    h1 { font-size:1.75rem; margin:0; letter-spacing:.02em; }
    p { margin:0; opacity:.7; font-size:.95rem; }
    .bar { width:180px; height:3px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; }
    .bar > i { display:block; height:100%; width:40%; background:var(--accent);
      animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(280%)} }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="logo.png" alt="" width="88" height="88" />
    <h1>Supymem</h1>
    <p id="status">Starting Supymem…</p>
    <div class="bar"><i></i></div>
  </main>
  <script>
    setTimeout(function () {
      var el = document.getElementById("status");
      if (el && !el.dataset.final) {
        el.textContent = "The connection is taking longer than expected. Quit and reopen Supymem if this screen does not change.";
      }
    }, 45000);
  </script>
</body>
</html>
